name: Native core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      DASSDL3_CORE_TESTS: '^sdl3_(lifecycle_contracts|lifecycle_gc|lifecycle_square|event_callback_types|gpu_api_boundary|fluent_builder_errors|gpu_type_errors|fluent_builders|gpu_pipeline_types|gpu_types|pixel_view_escape|compound_returns|peripherals|filesystem|platform_services|scope|properties|events|process_loadso)$'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build saved bindings and DLL SDK
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $inventory = ctest --test-dir build/native --show-only=json-v1 -R $env:DASSDL3_CORE_TESTS | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($inventory.tests.Count -ne 19) { throw "Expected all 19 core tests to be registered" }
          cmake --build build/native --target dasSDL3_runner daslang libDaScriptDyn --parallel 6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Interpreter and API contracts
        run: ctest --test-dir build/native --output-on-failure -R $env:DASSDL3_CORE_TESTS
      - name: Build package and CLI helper
        run: |
          cmake -S src/package -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release "-DDASLANG_DIR=$pwd/third_party/daScript" "-DSDL3_DIR=$pwd/build/native/_deps/sdl3-build" -DDASSDL3_DASPKG_CLI_SUPPORT=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/package --parallel 6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package metadata, install and relocation
        # Source staging fingerprints this CI SDK; committed repository profiles
        # deliberately require their exact reference binaries instead.
        run: ctest --test-dir build/package --output-on-failure -R '^sdl3_daspkg_(manifest|consumer|source)$'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-logs
          path: |
            build/**/Testing/Temporary/*.log
            build/daspkg */**/*.log

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev libdrm-dev libgbm-dev libasound2-dev libpulse-dev \
            libpipewire-0.3-dev libudev-dev libdbus-1-dev libibus-1.0-dev
      - name: Build interpreter and strict AOT
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DDAS_ENABLE_PIC=ON -DDAS_PUGIXML_DISABLED=OFF
          cmake --build build/linux --target dasSDL3_runner linux_aot_runner linux_missing_aot linux_allocator_test --parallel 6
      - name: Linux core regressions
        run: ctest --test-dir build/linux -L linux-core --output-on-failure
      - name: Install Linux dynamic SDK
        run: python3 tools/prepare_linux_daspkg_sdk.py --build build/linux --output build/linux-sdk
      - name: Build Linux package
        run: |
          cmake -S src/package -B build/linux-package -G Ninja -DCMAKE_BUILD_TYPE=Release -DDASLANG_DIR="$PWD/build/linux-sdk" -DSDL3_DIR="$PWD/build/linux/_deps/sdl3-build"
          cmake --build build/linux-package --parallel 6
      - name: Linux package metadata, binary and source installation
        run: ctest --test-dir build/linux-package --output-on-failure -R '^sdl3_daspkg_(manifest|consumer|source)$'
      - name: Linux SDK relocation and ELF audit
        run: python3 tests/test_linux_daspkg_sdk.py --sdk build/linux-sdk --module build/linux-package/module/dasSDL3.shared_module
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-logs
          path: |
            build/**/Testing/Temporary/*.log
            build/daspkg */**/*.log
