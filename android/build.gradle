plugins {
    id 'com.android.application' version '8.7.3'
}

def stage = file(findProperty('nativeStage') ?: '../build/android-stage')
layout.buildDirectory.set(file('../build/android-apk'))
android {
    namespace 'org.dassdl3.smoke'
    compileSdk 35
    ndkVersion '28.2.13676358'
    buildToolsVersion '35.0.1'
    defaultConfig {
        applicationId 'org.dassdl3.smoke'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    sourceSets.main {
        manifest.srcFile 'AndroidManifest.xml'
        java.srcDirs = ['java', new File(stage, 'java')]
        assets.srcDirs = [new File(stage, 'assets')]
        jniLibs.srcDirs = [new File(stage, 'jniLibs')]
    }
}

tasks.named('preBuild') {
    doFirst {
        for (path in ['java/org/libsdl/app/SDLActivity.java', 'assets/app/android/smoke.das',
                      'jniLibs/arm64-v8a/libmain.so', 'jniLibs/arm64-v8a/libSDL3.so']) {
            if (!new File(stage, path).isFile()) {
                throw new GradleException("Missing ${path} in ${stage}. Install the android-apk CMake component first.")
            }
        }
    }
}
